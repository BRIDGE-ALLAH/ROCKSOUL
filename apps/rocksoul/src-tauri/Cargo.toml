[package]
name = "rocksoul-desktop"
version = "0.1.0"
description = "ROCKSOUL — adaptive creative intelligence"
authors = ["BRIDGE-ALLAH"]
edition = "2024"
rust-version = "1.94"

[lib]
name = "rocksoul_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.7.2"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tauri = { version = "2.12.3" }
tauri-plugin-dialog = "2.8.2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }