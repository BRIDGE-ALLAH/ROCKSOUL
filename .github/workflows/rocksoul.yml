name: Rocksoul Desktop Checks

on:
  push:
    branches:
      - main
      - "docs/**"
      - "feat/**"
  pull_request:
    branches:
      - main
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows frontend + Rust core
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/rocksoul
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/rocksoul/src-tauri -> target

      - name: Install frontend dependencies
        run: bun install

      - name: Type-check
        run: bun run check

      - name: Build frontend
        run: bun run build

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Compile Tauri desktop executable
        run: bun run tauri build --debug --no-bundle