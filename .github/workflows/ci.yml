name: Rocksoul CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "docs/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "bun.lock"
      - "apps/desktop/**"
      - "crates/**"
  pull_request:
    branches:
      - main
      - "docs/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "bun.lock"
      - "apps/desktop/**"
      - "crates/**"

permissions:
  contents: read

concurrency:
  group: rocksoul-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run core tests
        run: cargo test -p rocksoul-core
      - name: Run Clippy
        run: cargo clippy -p rocksoul-core --all-targets -- -D warnings

  ui:
    name: UI typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install
      - name: Typecheck UI
        run: bun run ui:check
      - name: Build UI
        run: bun run ui:build

  desktop-windows:
    name: Windows desktop build and E2E smoke test
    # windows-2025-vs2026 has a known WebView2/WebDriver regression:
    # tauri-driver cannot create a DevToolsActivePort session. Pin the
    # interactive Tauri E2E job to the verified windows-2022 image until
    # that runner regression is resolved upstream.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install UI dependencies
        run: bun install
      - name: Compile all Rust targets
        run: cargo check --workspace --all-targets
      - name: Build UI
        run: bun run ui:build
      - name: Build native desktop executable
        run: cargo build --release -p rocksoul-desktop
      - name: Prepare synthetic local workspace
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP "rocksoul-e2e-workspace"
          Remove-Item -LiteralPath $workspace -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $workspace "src") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $workspace "target") | Out-Null
          Set-Content -LiteralPath (Join-Path $workspace "README.md") -Value "WORKSPACE_CONTENT_SENTINEL — this content must remain untouched." -NoNewline
          Set-Content -LiteralPath (Join-Path $workspace "src/index.ts") -Value "SOURCE_CONTENT_SENTINEL" -NoNewline
          Set-Content -LiteralPath (Join-Path $workspace ".gitignore") -Value "target/" -NoNewline
          Set-Content -LiteralPath (Join-Path $workspace ".env") -Value "SECRET_VALUE_SENTINEL=must-not-enter-the-artifact" -NoNewline
          Set-Content -LiteralPath (Join-Path $workspace "target/generated.txt") -Value "BUILD_OUTPUT_SENTINEL" -NoNewline
          "ROCKSOUL_E2E_WORKSPACE=$workspace" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set up Node.js for WebDriver
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install desktop E2E dependencies
        run: npm install --no-audit --no-fund
        working-directory: apps/desktop/e2e
      - name: Check WebDriver test syntax
        run: |
          node --check wdio.conf.mjs
          node --check specs/local-mission.spec.mjs
        working-directory: apps/desktop/e2e
      - name: Run native Windows desktop E2E
        run: npm test
        working-directory: apps/desktop/e2e
      - name: Upload desktop E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rocksoul-windows-e2e-diagnostics
          path: |
            apps/desktop/e2e/test-results/
            apps/desktop/e2e/logs/
          if-no-files-found: ignore
