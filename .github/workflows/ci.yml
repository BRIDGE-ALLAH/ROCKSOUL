name: Rocksoul CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rocksoul-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run core tests
        run: cargo test -p rocksoul-core
      - name: Run Clippy
        run: cargo clippy -p rocksoul-core --all-targets -- -D warnings

  ui:
    name: UI typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install
      - name: Typecheck UI
        run: bun run ui:check
      - name: Build UI
        run: bun run ui:build

  desktop-windows:
    name: Windows desktop compile check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install UI dependencies
        run: bun install
      - name: Compile all Rust targets
        run: cargo check --workspace --all-targets
      - name: Build UI
        run: bun run ui:build
